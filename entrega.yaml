apiVersion: v1
kind: Namespace
metadata:
  name: ns-juan-abarca
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-juan-abarca
  namespace: ns-juan-abarca
data:
  AMBIENTE: "produccion"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-juan-abarca
  namespace: ns-juan-abarca
type: Opaque
stringData:
  # Valor de demostración para la entrega.
  API_KEY: "api-key-juan-abarca"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-juan-abarca
  namespace: ns-juan-abarca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-juan-abarca
  template:
    metadata:
      labels:
        app: app-juan-abarca
    spec:
      imagePullSecrets:
        - name: regcred-dh
      containers:
        - name: app-juan-abarca
          image: jjabarca/repo-lab3:juan-abarca
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-juan-abarca
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-juan-abarca
                  key: API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-juan-abarca
  namespace: ns-juan-abarca
spec:
  type: ClusterIP
  selector:
    app: app-juan-abarca
  ports:
    - name: http
      port: 80
      targetPort: http
